<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 2rem; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">Gestão de Agendamentos (Relacional)</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card p-4 mb-4">
                    <h5 class="card-title mb-3">Novo Agendamento</h5>
                    <form id="agendamentoForm">
                        
                        <div class="mb-3">
                            <label class="form-label">Aluno</label>
                            <select id="alunoId" class="form-select" required>
                                <option value="" disabled selected>Selecione um aluno...</option>
                                <option value="1">1 - Maria Silva</option>
                                <option value="2">2 - João Pedro</option>
                                <option value="3">3 - Ana Beatriz</option>
                                <option value="4">4 - Carlos Eduardo</option>
                            </select>
                            <div class="form-text">Alunos gerados pelo DataLoader.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categorias (Múltipla Escolha)</label>
                            <div class="form-check">
                                <input class="form-check-input categoria-checkbox" type="checkbox" value="1" id="cat1">
                                <label class="form-check-label" for="cat1">Dúvida de Aula</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input categoria-checkbox" type="checkbox" value="2" id="cat2">
                                <label class="form-check-label" for="cat2">Revisão para Prova</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input categoria-checkbox" type="checkbox" value="3" id="cat3">
                                <label class="form-check-label" for="cat3">Orientação de Projeto</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="dataHora" class="form-label">Data e Hora</label>
                            <input type="datetime-local" id="dataHora" class="form-control" required>
                            <div class="form-text text-danger">Mínimo de 24h de antecedência!</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Agendar</button>
                    </form>
                    <div id="mensagem" class="mt-3"></div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4">
                    <h5 class="card-title mb-3">Agendamentos Registrados</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Aluno</th>
                                    <th>Matrícula</th>
                                    <th>Categorias</th>
                                    <th>Data e Hora</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaCorpo">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
